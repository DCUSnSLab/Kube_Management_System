apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garbage-collector
  namespace: lablab-workspaces
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garbage-collector
  namespace: lablab-workspaces
subjects:
  - kind: ServiceAccount
    name: garbage-collector
    namespace: k8s-gc
roleRef:
  kind: Role
  name: garbage-collector
  apiGroup: rbac.authorization.k8s.io
